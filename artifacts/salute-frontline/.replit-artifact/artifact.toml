kind = "web"
previewPath = "/"
title = "Salute to the Frontline"
version = "1.0.0"
id = "artifacts/salute-frontline"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18416

[services.development]
run = "pnpm --filter @workspace/salute-frontline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salute-frontline", "run", "build" ]
publicDir = "artifacts/salute-frontline/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18416"
BASE_PATH = "/"
