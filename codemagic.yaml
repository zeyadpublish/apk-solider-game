workflows:
  android-debug-apk:
    name: Build Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.13.1
      java: 21
    scripts:
      - name: Check build tools
        script: |
          cd "$CM_BUILD_DIR"
          node --version
          npm --version
          java -version
      - name: Pull large game assets
        script: |
          cd "$CM_BUILD_DIR"
          git lfs install
          git lfs pull
      - name: Prepare Capacitor Android project
        script: |
          cd "$CM_BUILD_DIR/release/frontline-uae-war-city-mobile"
          npm install --package-lock=false --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR/release/frontline-uae-war-city-mobile/android"
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - release/frontline-uae-war-city-mobile/android/app/build/outputs/**/*.apk
