workflows:
  android-debug-apk:
    name: Build Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - production
      node: 22.13.1
      java: 21
    scripts:
      - name: Check build tools
        script: |
          cd "$CM_BUILD_DIR"
          node --version
          npm --version
          java -version
      - name: Pull large game assets
        script: |
          cd "$CM_BUILD_DIR"
          git lfs install
          git lfs pull
      - name: Prepare Capacitor Android project
        script: |
          cd "$CM_BUILD_DIR/release/frontline-uae-war-city-mobile"
          npm install --package-lock=false --no-audit --no-fund
          node <<'NODE'
          const fs = require("fs");
          const apiUrl = (process.env.FRONTLINE_API_BASE_URL || "").trim().replace(/\/+$/, "");
          const wsUrl = (process.env.FRONTLINE_WS_BASE_URL || "").trim().replace(/\/+$/, "");
          if (!apiUrl) {
            console.error("FRONTLINE_API_BASE_URL is missing. Add your hosted API URL in Codemagic environment variables before building the APK.");
            process.exit(1);
          }
          fs.writeFileSync(
            "www/frontline-runtime-config.js",
            `window.FRONTLINE_API_BASE_URL = ${JSON.stringify(apiUrl)};\nwindow.FRONTLINE_WS_BASE_URL = ${JSON.stringify(wsUrl)};\n`,
          );
          NODE
          npx cap add android
          npx cap sync android
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const source = path.resolve("app-icon/android");
          const target = path.resolve("android/app/src/main/res");
          if (!fs.existsSync(source)) {
            console.error("Missing app icon resources at app-icon/android");
            process.exit(1);
          }
          for (const folder of [
            "mipmap-mdpi",
            "mipmap-hdpi",
            "mipmap-xhdpi",
            "mipmap-xxhdpi",
            "mipmap-xxxhdpi",
            "mipmap-anydpi-v26",
            "values",
          ]) {
            fs.cpSync(path.join(source, folder), path.join(target, folder), { recursive: true });
          }
          NODE
          node <<'NODE'
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          const originalManifest = manifest;
          manifest = manifest.replace(
            /<activity\b([^>]*android:name="\.MainActivity"[^>]*)>/,
            (match, attrs) => {
              let nextAttrs = attrs.replace(/\sandroid:screenOrientation="[^"]*"/, "");
              return `<activity${nextAttrs}\n            android:screenOrientation="landscape">`;
            },
          );
          if (manifest === originalManifest) {
            console.error("Could not lock Android MainActivity to landscape.");
            process.exit(1);
          }
          fs.writeFileSync(manifestPath, manifest);
          NODE
      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR/release/frontline-uae-war-city-mobile/android"
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - release/frontline-uae-war-city-mobile/android/app/build/outputs/**/*.apk
  ios-signed-ipa:
    name: Build iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zeyadmamdouh.frontline
      node: 22.13.1
      xcode: 16.4
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Check iOS build tools
        script: |
          cd "$CM_BUILD_DIR"
          node --version
          npm --version
          xcodebuild -version
          pod --version
      - name: Pull large game assets
        script: |
          cd "$CM_BUILD_DIR"
          git lfs install
          git lfs pull
      - name: Prepare Capacitor iOS project
        script: |
          cd "$CM_BUILD_DIR/release/frontline-uae-war-city-mobile"
          npm install --package-lock=false --no-audit --no-fund
          node <<'NODE'
          const fs = require("fs");
          const apiUrl = (process.env.FRONTLINE_API_BASE_URL || "").trim().replace(/\/+$/, "");
          const wsUrl = (process.env.FRONTLINE_WS_BASE_URL || "").trim().replace(/\/+$/, "");
          if (!apiUrl) {
            console.error("FRONTLINE_API_BASE_URL is missing. Add your hosted API URL in Codemagic environment variables before building the IPA.");
            process.exit(1);
          }
          fs.writeFileSync(
            "www/frontline-runtime-config.js",
            `window.FRONTLINE_API_BASE_URL = ${JSON.stringify(apiUrl)};\nwindow.FRONTLINE_WS_BASE_URL = ${JSON.stringify(wsUrl)};\n`,
          );
          NODE
          npx cap add ios
          npx cap sync ios
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const source = path.resolve("app-icon/frontline-logo-source.png");
          const target = path.resolve("ios/App/App/Assets.xcassets/AppIcon.appiconset");
          if (!fs.existsSync(source)) {
            console.error("Missing app icon source at app-icon/frontline-logo-source.png");
            process.exit(1);
          }
          fs.rmSync(target, { recursive: true, force: true });
          fs.mkdirSync(target, { recursive: true });
          const icons = [
            ["20x20", "iphone", "2x"], ["20x20", "iphone", "3x"],
            ["29x29", "iphone", "2x"], ["29x29", "iphone", "3x"],
            ["40x40", "iphone", "2x"], ["40x40", "iphone", "3x"],
            ["60x60", "iphone", "2x"], ["60x60", "iphone", "3x"],
            ["20x20", "ipad", "1x"], ["20x20", "ipad", "2x"],
            ["29x29", "ipad", "1x"], ["29x29", "ipad", "2x"],
            ["40x40", "ipad", "1x"], ["40x40", "ipad", "2x"],
            ["76x76", "ipad", "1x"], ["76x76", "ipad", "2x"],
            ["83.5x83.5", "ipad", "2x"],
            ["1024x1024", "ios-marketing", "1x"],
          ];
          const images = [];
          for (const [size, idiom, scale] of icons) {
            const base = Number(size.split("x")[0]);
            const multiplier = Number(scale.replace("x", ""));
            const pixels = Math.round(base * multiplier);
            const filename = `icon-${idiom}-${size.replace(".", "_")}@${scale}.png`;
            const output = path.join(target, filename);
            require("child_process").execFileSync("sips", ["-z", String(pixels), String(pixels), source, "--out", output], { stdio: "inherit" });
            images.push({ size, idiom, filename, scale });
          }
          fs.writeFileSync(
            path.join(target, "Contents.json"),
            JSON.stringify({ images, info: { version: 1, author: "xcode" } }, null, 2),
          );
          NODE
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          cd ios/App
          pod install
      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/release/frontline-uae-war-city-mobile"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - release/frontline-uae-war-city-mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
