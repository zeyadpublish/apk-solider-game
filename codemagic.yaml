workflows:
  android-debug-apk:
    name: Build Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    scripts:
      - name: Check build tools
        script: |
          cd "$CM_BUILD_DIR"
          node --version
          npm --version
          npx --yes pnpm@10.14.0 --version
      - name: Pull large game assets
        script: |
          cd "$CM_BUILD_DIR"
          git lfs pull
      - name: Install project dependencies
        script: |
          cd "$CM_BUILD_DIR"
          npx --yes pnpm@10.14.0 install --frozen-lockfile
      - name: Build web and mobile handoff
        script: |
          cd "$CM_BUILD_DIR"
          npx --yes pnpm@10.14.0 run release:package
      - name: Create Capacitor Android project
        script: |
          cd "$CM_BUILD_DIR"
          cd release/frontline-uae-war-city-mobile
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"
          cd release/frontline-uae-war-city-mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - release/frontline-uae-war-city-mobile/android/app/build/outputs/**/*.apk
